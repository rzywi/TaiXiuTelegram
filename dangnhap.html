<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — Tea &amp; Cafe</title>
    <meta name="description" content="Đăng nhập vào tài khoản Tea & Cafe để mua hàng và theo dõi đơn hàng.">
    <meta name="theme-color" content="#6f4328">
    <meta property="og:title" content="Đăng nhập — Tea & Cafe">
    <meta property="og:description" content="Đăng nhập vào tài khoản Tea & Cafe.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236f4328'/%3E%3Cpath d='M17 27h24v9a11 11 0 0 1-11 11h-2a11 11 0 0 1-11-11z' fill='%23fdfbf8'/%3E%3Cpath d='M41 29h4a5.5 5.5 0 0 1 0 11h-4' fill='none' stroke='%23fdfbf8' stroke-width='3.5'/%3E%3Cpath d='M25 19c2.5-3.5 6.5-3.5 9 0M31 13c2.5-3.5 6.5-3.5 9 0' stroke='%23e8c9a3' stroke-width='3.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ===================== HEADER ===================== -->

<header class="header">
    <div class="container header-inner">

        <a href="index.html" class="logo" aria-label="Tea & Cafe - Trang chủ">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 9h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/>
                <path d="M16 10.5h1.5a2.75 2.75 0 0 1 0 5.5H16"/>
                <path d="M7.5 3.5c0 1-1 1-1 2s1 1 1 2M11.5 3.5c0 1-1 1-1 2s1 1 1 2"/>
            </svg>
            <span class="logo-text"><span>TEA</span> &amp; CAFE</span>
        </a>

        <nav class="menu" id="mainMenu" aria-label="Menu chính">
            <a href="index.html">Trang chủ</a>
            <a href="sanpham.html">Sản phẩm</a>
            <a href="gioithieu.html">Giới thiệu</a>
            <a href="lienhe.html">Liên hệ</a>
        </nav>

        <div class="header-actions">
            <a href="giohang.html" class="header-cart" aria-label="Giỏ hàng">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="9" cy="20" r="1.6"/>
                    <circle cx="17" cy="20" r="1.6"/>
                    <path d="M2.5 3.5h2.4l2.5 11.5h10.7l2.1-8.5H6"/>
                </svg>
                Giỏ hàng
                <span class="cart-badge">0</span>
            </a>
            <a href="dangnhap.html" class="login-link">Đăng nhập</a>
        </div>

        <button type="button" class="nav-toggle" id="navToggle" aria-label="Mở menu" aria-expanded="false" aria-controls="mainMenu">
            <span></span><span></span><span></span>
        </button>

    </div>
</header>

<main>

    <!-- ===================== ĐĂNG NHẬP ===================== -->

    <section class="auth-section">
        <div class="auth-box">

            <a href="index.html" class="logo" aria-label="Tea & Cafe - Trang chủ">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 9h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/>
                    <path d="M16 10.5h1.5a2.75 2.75 0 0 1 0 5.5H16"/>
                    <path d="M7.5 3.5c0 1-1 1-1 2s1 1 1 2M11.5 3.5c0 1-1 1-1 2s1 1 1 2"/>
                </svg>
                <span class="logo-text"><span>TEA</span> &amp; CAFE</span>
            </a>

            <h1>Đăng nhập</h1>
            <p class="auth-subtitle">Chào mừng bạn quay lại Tea &amp; Cafe</p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="loginUsername">Tên đăng nhập</label>
                    <input type="text" id="loginUsername" placeholder="Nhập tên đăng nhập" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Mật khẩu</label>
                    <input type="password" id="loginPassword" placeholder="Nhập mật khẩu" required>
                </div>

                <button type="submit" class="btn btn-block auth-button">Đăng nhập</button>

            </form>

            <p class="auth-bottom">
                Chưa có tài khoản?
                <a href="dangky.html">Đăng ký ngay</a>
            </p>

            <div class="auth-hint">
                Tài khoản quản trị mẫu: <code>admin</code> / <code>admin123</code>
            </div>

        </div>
    </section>

</main>

<script src="js/script.js"></script>

</body>
</html>
